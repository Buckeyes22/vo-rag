services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports: ["127.0.0.1:${VORAG_TEST_QDRANT_PORT:-6334}:6333"]
    tmpfs: ["/qdrant/storage:size=8g"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vorag
      POSTGRES_PASSWORD: vorag
      POSTGRES_DB: vorag_test
    ports: ["127.0.0.1:${VORAG_TEST_POSTGRES_PORT:-5444}:5432"]
    tmpfs: ["/var/lib/postgresql/data:size=1g"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorag"]
      interval: 5s
      timeout: 3s
      retries: 10
